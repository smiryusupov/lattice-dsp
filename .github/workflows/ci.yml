name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint and format check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

  docs:
    name: Sphinx docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs,examples,benchmark]"

      - name: Build docs with warnings as errors
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        env:
          VERBOSE: '1'
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --verbose -e ".[dev,examples,benchmark]"

      - name: Verify compiled extension was built
        run: |
          python - <<'PY'
          import lattice_dsp
          import lattice_dsp._core as core
          print('lattice_dsp:', lattice_dsp.__file__)
          print('_core:', core.__file__)
          print('HAS_OPENMP:', lattice_dsp.HAS_OPENMP)
          PY

      - name: Run tests
        run: pytest -q
