name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      channels:
        description: Number of independent streams
        required: false
        default: '32'
      samples:
        description: Samples per stream
        required: false
        default: '20000'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'benchmarks/**'
      - 'pyproject.toml'
      - 'CMakeLists.txt'

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-smoke:
    name: Benchmark smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package with benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[benchmark]"

      - name: Run benchmark smoke test
        run: >-
          python benchmarks/run_benchmarks.py
          --channels ${{ github.event.inputs.channels || '8' }}
          --samples ${{ github.event.inputs.samples || '5000' }}
          --repeats 2
          --output benchmark-results.json

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
          if-no-files-found: error
