version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    build:
      html:
        - LATTICE_DSP_TUTORIAL_TIMEOUT=340 bash scripts/build_docs_with_results.sh
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -R docs/_build/html/. "$READTHEDOCS_OUTPUT/html/"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
        - examples
        - benchmark