build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_install:
      - cd /tmp && python -c "import lattice_dsp, lattice_dsp._core as core; print(lattice_dsp.__file__); print(core.__file__)"
    build:
      html:
        - LATTICE_DSP_TUTORIAL_TIMEOUT=340 bash scripts/build_docs_with_results.sh
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -R docs/_build/html/. "$READTHEDOCS_OUTPUT/html/"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
        - examples
        - benchmark